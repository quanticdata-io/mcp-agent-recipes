[project]
name = "mcp-agent-recipes"
version = "0.1.0"
description = "Runnable recipes that connect the QuanticData MCP server to the OpenAI Agents SDK, the Claude Agent SDK and LangGraph."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.25",
  "claude-agent-sdk>=0.2.180",
  "langchain>=1.5",
  "langchain-anthropic>=1.7",
  "langchain-mcp-adapters>=0.3",
  "langgraph>=1.2",
  "mcp>=1.30",
]

[project.urls]
Homepage = "https://github.com/quanticdata-io/mcp-agent-recipes"
Issues = "https://github.com/quanticdata-io/mcp-agent-recipes/issues"
"MCP server" = "https://quanticdata.io/mcp-server/"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "RET"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["qd_mcp_config.py", "recipes", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real QuanticData MCP server (set QD_LIVE_TESTS=1)"]
